name: Publish to PyPI

# Publishes on a version tag (e.g. `v0.1.0`) using PyPI Trusted Publishing (OIDC),
# so no API token needs to be stored. Configure the trusted publisher for the
# `airportsearch` project at https://pypi.org/manage/account/publishing/ first.

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
