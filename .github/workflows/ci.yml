name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      # Only hard errors (syntax, undefined names) fail the build; style is advisory.
      - name: Lint (errors)
        run: ruff check --select E9,F63,F7,F82 src scripts tests
      - name: Lint (style, advisory)
        run: ruff check src scripts tests || true

  package:
    name: build & smoke-test wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Metadata check
        run: twine check dist/*
      - name: Install wheel in a clean venv and smoke-test
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -c "import airportsearch as a; from airportsearch.geo import get_landmask; assert a.search('Tokyo (HND)')[0].iata == 'HND'; assert a.search('Utrecht')[0].via == 'nearest'; assert a.search('France')[0].via == 'country'; assert get_landmask() is not None; print('wheel smoke OK:', len(a.get_index()), 'airports')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
